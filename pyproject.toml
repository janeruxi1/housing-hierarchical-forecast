[project]
name = "housing"
version = "0.1.0"
description = "Hierarchical home-value forecasts (nation, state, metro, county) on Zillow ZHVI, with reconciliation, rolling backtests and rate/recession scenarios"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E402"]
"notebooks/*.ipynb" = ["E402"]
